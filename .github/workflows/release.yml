name: Release

# Fires on every push to main; the version job skips a push that did not come
# from a merged pull request, so only PR merges release. workflow_dispatch is
# kept for manual re-runs and for setting a version by hand.
#
# The trigger is `push` rather than `pull_request: closed` because the release
# is signed keylessly with cosign: the signing certificate names the workflow
# and the ref it ran on, and on a push to main that is always
# release.yml@refs/heads/main -- the exact identity `folio upgrade` and the
# README's `cosign verify-blob` command check for. (On a pull_request event it
# would be refs/pull/N/merge, different for every release.)
#
# Versions follow SemVer with the major version held at 0. The next version
# is the newest v0.Y.Z tag bumped by the merged PR's label: semver:minor for a
# new or improved feature, semver:patch (or no label) for fixes only.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the last version to bump
        type: choice
        options: [patch, minor]
        default: patch
      version:
        description: Exact version to release (e.g. v0.1.0, major must be 0); overrides bump
        required: false

permissions:
  contents: write

# One release at a time: each run derives its version from the tags the
# previous run created.
concurrency:
  group: release
  cancel-in-progress: false

env:
  BUILD_SHA: ${{ github.sha }}

jobs:
  version:
    name: Version
    # A release from any other branch would be signed as that branch and
    # fail verification, so a manual run must be started on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # pull-requests: read is for finding the merged PR and its labels.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0

      # The result is also stamped into the binary via -X main.version
      # (see main.go: `var version = "dev"`).
      - name: Next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semver='^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          last=$(git tag --list 'v*' | grep -E "$semver" | sort -V | tail -n1 || true)
          last=${last:-v0.0.0}

          if [ -n "${INPUT_VERSION:-}" ]; then
            next=$INPUT_VERSION
            if ! printf '%s\n' "$next" | grep -Eq "$semver"; then
              echo "::error::version '$next' is not of the form v0.MINOR.PATCH"
              exit 1
            fi
          else
            bump=${INPUT_BUMP:-patch}
            if [ "${{ github.event_name }}" = "push" ]; then
              # The merged pull request this commit belongs to, if any.
              pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BUILD_SHA}/pulls" \
                --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty')
              if [ -z "$pr" ]; then
                echo "No merged pull request for ${BUILD_SHA}; nothing to release."
                echo "version=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              bump=patch
              if printf '%s' "$pr" | jq -e '[.labels[].name] | index("semver:minor") != null' >/dev/null; then
                bump=minor
              fi
            fi
            IFS=. read -r _ minor patch <<<"${last#v}"
            case $bump in
              minor) next="v0.$((minor + 1)).0" ;;
              *)     next="v0.${minor}.$((patch + 1))" ;;
            esac
          fi

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::tag $next already exists"
            exit 1
          fi
          echo "Last release: $last, next: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SHA }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # The Windows setup program, folio_<tag>_windows_setup.exe, built (and
  # signed, once SignPath is set up) by windows-setup.yml and handed to the
  # release job as the windows-setup artifact, which publishes it and lists
  # it in the signed SHA256SUMS.txt.
  windows-setup:
    name: Windows setup program
    needs: [version, test]
    if: needs.version.outputs.version != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/windows-setup.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}
      sign: true
    secrets: inherit

  # GoReleaser builds the six targets, packages them (archives, deb, rpm,
  # apk, Arch), writes an SBOM for each, adds the Windows setup program,
  # writes and signs
  # SHA256SUMS.txt, publishes the release, pushes the Homebrew cask and Scoop
  # manifest and opens the winget pull request. .goreleaser.yaml has the
  # details, and the names folio upgrade depends on.
  release:
    name: Build and publish release
    needs: [version, test, windows-setup]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    # id-token lets cosign get a short-lived signing certificate from
    # Sigstore for this workflow run; no key is stored anywhere. The
    # attestation step uses the same token, and attestations: write to store
    # its result with GitHub. Job-level permissions replace the top-level
    # ones, so contents: write is repeated.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # GoReleaser reads the version from the tag on HEAD and the previous
      # release from the tags before it, so it needs the full history.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # syft writes the SBOMs (packaging/sbom/sbom.sh). Like the scanners in
      # vulncheck.yml it is built from a pinned version, checked against the
      # Go checksum database; setup-go puts it on the PATH.
      - name: Install syft
        run: go install github.com/anchore/syft/cmd/syft@v1.57.2

      # A local tag only: the release GoReleaser creates makes the tag on
      # GitHub, pinned to the merged commit (target_commitish).
      - name: Tag
        run: git tag "${VERSION}" "${BUILD_SHA}"

      # installer/ is in .gitignore, so GoReleaser does not see a dirty tree.
      - uses: actions/download-artifact@v8
        with:
          name: windows-setup
          path: installer

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Writes the Homebrew tap and the Scoop bucket. While it is unset
          # the release goes out without them.
          HOMEBREW_SCOOP_TOKEN: ${{ secrets.HOMEBREW_SCOOP_TOKEN }}
          # Pushes the winget manifest to the winget-pkgs fork and opens the
          # pull request to microsoft/winget-pkgs. While it is unset the
          # manifest is built but not submitted.
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

      # SLSA build provenance, stored with GitHub's attestation API, so that
      # `gh attestation verify <file> --repo christophberger-ailab/foolscap-folio`
      # checks a download without cosign or SHA256SUMS.txt. The subjects are
      # every file SHA256SUMS.txt lists (archives, packages, SBOMs, the
      # Windows setup program), the list itself, and the bare binaries: the
      # Homebrew cask, the Scoop manifest, winget and folio upgrade all
      # install the binary from the archive byte for byte, so an installed
      # folio verifies too. Signed through Sigstore with this run's OIDC
      # token, like the cosign signature above.
      - name: Collect attestation subjects
        run: |
          set -euo pipefail
          subjects="$RUNNER_TEMP/attestation-subjects.txt"
          cp dist/SHA256SUMS.txt "$subjects"
          (cd dist && sha256sum SHA256SUMS.txt folio_*/folio folio_*/folio.exe) >> "$subjects"
          echo "ATTESTATION_SUBJECTS=$subjects" >> "$GITHUB_ENV"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ env.ATTESTATION_SUBJECTS }}

  # An SBOM attestation per platform: the platform's CycloneDX SBOM, signed
  # as describing its archive and the binary in it, so that
  # `gh attestation verify --predicate-type https://cyclonedx.org/bom` hands
  # back the SBOM that belongs to a given download or installed binary. The
  # files come from the release just published; SHA256SUMS.txt is checked
  # first, so the SBOM attested is the one the signed list names.
  attest-sbom:
    name: Attest SBOM (${{ matrix.os }}/${{ matrix.arch }})
    needs: [version, release]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Download archive and SBOM
        run: |
          set -euo pipefail
          base="folio_${VERSION}_${OS}_${ARCH}"
          if [ "$OS" = windows ]; then archive=$base.zip; bin=folio.exe; else archive=$base.tar.gz; bin=folio; fi
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern "$base.cdx.json" --pattern SHA256SUMS.txt
          grep -E "  ($archive|$base\.cdx\.json)\$" SHA256SUMS.txt | sha256sum --check --strict
          mkdir bin
          if [ "$OS" = windows ]; then unzip -q "$archive" "$bin" -d bin; else tar -xzf "$archive" -C bin "$bin"; fi
          {
            echo "ARCHIVE=$archive"
            echo "BINARY=bin/$bin"
            echo "SBOM=$base.cdx.json"
          } >> "$GITHUB_ENV"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ env.ARCHIVE }}
            ${{ env.BINARY }}
          sbom-path: ${{ env.SBOM }}
