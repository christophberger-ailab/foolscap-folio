name: Release

# Fires on every push to main; the version job skips a push that did not come
# from a merged pull request, so only PR merges release. workflow_dispatch is
# kept for manual re-runs and for setting a version by hand.
#
# The trigger is `push` rather than `pull_request: closed` because the release
# is signed keylessly with cosign: the signing certificate names the workflow
# and the ref it ran on, and on a push to main that is always
# release.yml@refs/heads/main -- the exact identity `folio upgrade` and the
# README's `cosign verify-blob` command check for. (On a pull_request event it
# would be refs/pull/N/merge, different for every release.)
#
# Versions follow SemVer with the major version held at 0. The next version
# is the newest v0.Y.Z tag bumped by the merged PR's label: semver:minor for a
# new or improved feature, semver:patch (or no label) for fixes only.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the last version to bump
        type: choice
        options: [patch, minor]
        default: patch
      version:
        description: Exact version to release (e.g. v0.1.0, major must be 0); overrides bump
        required: false

permissions:
  contents: write

# One release at a time: each run derives its version from the tags the
# previous run created.
concurrency:
  group: release
  cancel-in-progress: false

env:
  BUILD_SHA: ${{ github.sha }}

jobs:
  version:
    name: Version
    # A release from any other branch would be signed as that branch and
    # fail verification, so a manual run must be started on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # pull-requests: read is for finding the merged PR and its labels.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0

      # The result is also stamped into the binary via -X main.version
      # (see main.go: `var version = "dev"`).
      - name: Next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semver='^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          last=$(git tag --list 'v*' | grep -E "$semver" | sort -V | tail -n1 || true)
          last=${last:-v0.0.0}

          if [ -n "${INPUT_VERSION:-}" ]; then
            next=$INPUT_VERSION
            if ! printf '%s\n' "$next" | grep -Eq "$semver"; then
              echo "::error::version '$next' is not of the form v0.MINOR.PATCH"
              exit 1
            fi
          else
            bump=${INPUT_BUMP:-patch}
            if [ "${{ github.event_name }}" = "push" ]; then
              # The merged pull request this commit belongs to, if any.
              pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BUILD_SHA}/pulls" \
                --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty')
              if [ -z "$pr" ]; then
                echo "No merged pull request for ${BUILD_SHA}; nothing to release."
                echo "version=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              bump=patch
              if printf '%s' "$pr" | jq -e '[.labels[].name] | index("semver:minor") != null' >/dev/null; then
                bump=minor
              fi
            fi
            IFS=. read -r _ minor patch <<<"${last#v}"
            case $bump in
              minor) next="v0.$((minor + 1)).0" ;;
              *)     next="v0.${minor}.$((patch + 1))" ;;
            esac
          fi

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::tag $next already exists"
            exit 1
          fi
          echo "Last release: $last, next: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SHA }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [version, test]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SHA }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # folio is pure Go (the only embedded data comes from //go:embed in
      # web/server.go), so CGO_ENABLED=0 gives a static binary and lets all
      # four targets cross-compile from the same ubuntu runner.
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          BIN=folio
          if [ "$GOOS" = "windows" ]; then BIN=folio.exe; fi
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${BIN}" \
            ./cmd/folio/

      - name: Package
        run: |
          set -euo pipefail
          NAME="folio_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p out
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -q "../out/${NAME}.zip" folio.exe
          else
            tar -czf "../out/${NAME}.tar.gz" folio
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: folio_${{ matrix.goos }}_${{ matrix.goarch }}
          path: out/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    # id-token lets cosign get a short-lived signing certificate from
    # Sigstore for this workflow run; no key is stored anywhere. Job-level
    # permissions replace the top-level ones, so contents: write is repeated.
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SHA }}

      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: folio_*
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd out
          # Match the archives explicitly rather than ./* so the redirect
          # target can never end up hashing itself.
          sha256sum folio_* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # SHA256SUMS.txt pins every archive, so signing it signs the release.
      # The bundle holds the signature, the certificate naming this workflow
      # and the transparency log entry: everything needed to verify offline.
      - name: Sign checksums
        run: |
          set -euo pipefail
          cd out
          cosign sign-blob --yes \
            --bundle SHA256SUMS.txt.sigstore.json \
            SHA256SUMS.txt

      # gh is preinstalled on GitHub-hosted runners, so this needs no
      # third-party action. --target pins the tag to the merged commit.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${VERSION}" \
            --target "${BUILD_SHA}" \
            --title "${VERSION}" \
            --generate-notes \
            out/*
