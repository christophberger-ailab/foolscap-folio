feature:
  name: render
  description: Render the project's topic × format × audience matrix, without Quarto or Pandoc

components:
  COMMAND:
    description: folio render [--topic <a>,<b>] [--format <f>] [--audience <a>] [--clean] [--dry-run] [<topic>...]
    requirements:
      1: Object name is "render"
      2: No subcommand
      3: Parameters
      3-1: Flag --project sets the path to the document tree. Defaults to the current directory
      3-2: Flag --topic takes a comma-separated list of topics. Defaults to every topic the project declares
      3-3: Flag --format takes a comma-separated list of formats. Defaults to every format a topic takes part in
      3-4: Flag --audience takes a comma-separated list of audiences. Defaults to every audience a topic takes part in
      3-5: Flag --clean empties the output directories of the selected formats before the first render. Defaults to false
      3-6: Flag --dry-run prints the files that would be written without writing anything. Defaults to false
      3-7: Positional arguments name topics and are added to --topic

constraints:
  STANDARD: See the constraints in spec.yaml.

  PROCESS:
    description: >
      The render flow is shared with `folio web` (see spec-web.yaml); both drive
      internal/build. Every format is built by folio itself; neither Quarto nor
      Pandoc nor LaTeX is invoked.
    requirements:
      1: The matrix is the cross product of the requested topics, formats, and audiences, cut down to what the topics and formats declare in folio.yml under `formats`, `audiences` and `topics`
      1-1: A topic, format or audience that folio.yml does not define is an error, not an empty result; so is a selection that matches no combination
      1-2: The order is stable -- formats outermost, then topics, then audiences -- and follows the order of folio.yml on each axis
      2: A website format (type html) yields one render per selected audience, covering all selected topics; a document format (docx, pdf) yields one render per topic and audience
      2-1: A website goes to `<output>/<dir>`; with more than one audience in the project and no placeholder in `dir`, to `<output>/<dir>-<audience>`
      2-2: A document goes to `<output>/<dir>/<file>.<type>`; `file` defaults to `{topic}`, plus `-{audience}` when the project has more than one audience
      3: With --clean, each selected format's output directory is emptied once, before the first render; a directory that is not below the output directory is refused
      4: Progress is written to stdout, one line per step
      5: A failing combination does not stop the remaining ones; the command reports how many failed and exits with an error
      6: A dry run writes nothing and prints the files it would write

  DOCUMENT:
    description: A document is the topic flattened into one Markdown text, parsed and filtered in Go, and written as DOCX and/or PDF.
    requirements:
      1: The text is the one `folio flatten` writes; its shortcodes (`include`, `var`, `pagebreak`) are resolved before it is parsed
      1-1: '`{{< include path >}}` takes a project-absolute path (leading `/`) or a path relative to the file holding the include, nested up to 8 deep; a path outside the project, a missing file and a cycle are errors'
      1-1-1: An included file's YAML front matter (a leading `---` block closed by `---` or `...`) is dropped; a leading `---` without a closing fence is text
      1-2: '`{{< var name >}}` resolves against `_variables.yml` and the selection''s variables; an undefined name is reported and left as written'
      1-3: Text inside fenced code blocks is not touched, and any other shortcode is reported once and left in the text
      2: Conditional content the selected format and audience do not show is removed after parsing (see CONDITIONAL in spec.yaml)
      3: The DOCX is written in Go. A format's `template` names a reference DOCX whose styles, page setup, headers, footers and numbering are used and whose body is discarded; a missing template fails before anything is written
      3-1: 'With `toc: true` the DOCX has a Word contents field'
      4: The PDF is laid out in Go (gopdf) from the same parsed document, A4, with embedded fonts, pagination, contents, links, headings, lists, ordinary tables and local images
      4-1: Emoji render in a monochrome emoji font, and a line never breaks inside a word that spans quote marks, emphasis or links
      4-2: An image among text in a paragraph is drawn inline on the text's baseline, and a line with a tall image grows to hold it; an image alone in its paragraph stays a block of its own
      4-3: Image width and height attributes are honoured in cm, mm, in, pt, px, em, per cent of the available width, and bare numbers as pixels; with one of the two given the other follows the aspect ratio, and an image too large for the text width or the page shrinks to fit
      4-4: 'With a `_brand.yml` at the project root, the PDF sets body text, headings and code in the typography base, headings and monospace fonts, choosing the closest weight and style among the family''s TrueType files; fonts it cannot embed (other formats, or not from local files) are reported and leave that text in the Go fonts, and emoji still fall back to the emoji font'
      4-5: Callouts are drawn in a box in the callout type's own color, with a thick left bar; the title of a default callout sits on a header background for that type and stays with the first lines of the body, and a callout running over pages keeps its box open at the page breaks
      4-5-1: A callout without a title of its own is titled with its type's name in the project's `lang`, taken from the `callouts` translations in the user's config.cue, else from the English and German titles folio knows, else in English; a regional `lang` (`fr-CA`) falls back to its language (`fr`). The website, DOCX, PDF and `folio preview` title callouts alike
      4-6: A `{{< pagebreak >}}` starts a new page, also inside lists, block quotes and callouts; a break on a page that holds nothing yet adds no blank page, and one inside a table cell is ignored
      4-7: A heading without text or image draws nothing, takes no space and opens no page; every page the layout starts can be addressed for its page number, contents entry and callout box, even if nothing was drawn on it
      4-8: 'A local SVG image is drawn as a PNG made from it, in the DOCX and the PDF alike, at its own size (width and height in px, else its viewBox); its shapes are drawn as the SVG subset oksvg supports, its text in the Go fonts, unrotated'
      4-9: An image that names no file of the project does not stop the render. The project's placeholder, `/assets/static/_placeholder.svg`, stands in for it in the DOCX, the PDF and the website, and a warning names the image; a project without that file gets the placeholder built into folio
      4-10: An image alone in its paragraph with alt text has that text as its caption below it, in the DOCX (the template's `Image Caption` or `Caption` style, centred, kept with the picture) and the PDF (italic, smaller); an image among text, in a table cell or footnote, or without alt text has none
      5: A topic may declare `cover:` as a project-relative PNG path supporting placeholders; a missing or invalid cover fails before rendering
      5-1: The cover is put in front of both the DOCX and the PDF with preserved aspect ratio, full-page for the PDF; the DOCX cover uses its own zero-margin section and page-relative image, and the original body section properties, styles, headers and footers are preserved
      6: Unsupported PDF constructs produce actionable errors rather than silently discarding content
      7: Mermaid diagrams stay code blocks, with a warning; math is not typeset
      8: 'PPTX slide decks are not supported; `::: slide` blocks and `.notes` are dropped'

  SITE:
    description: A website format writes a static site of all selected topics, with a layout like Quarto's.
    requirements:
      1: Each topic is one entry in a top navbar; the current topic's page tree is a left sidebar; the headings of the current page are a right "On this page" contents list with scroll-spy; each page has previous/next links
      1-1: The site's home page lists the topics
      2: Pages are rendered from the same tree and with the same heading demotion as a document, with the same shortcodes and conditional filter
      2-1: An image alone in its paragraph with alt text is a `<figure>` with that text as its `<figcaption>`, as Pandoc writes an implicit figure; an image among text or without alt text stays in its paragraph
      2-2: 'A `::: {.subpages title="..."}` block is replaced, at its position, by a table of the page''s subpages, one row each with the subpage''s title linking to it, the row under the pointer highlighted, as a Quarto listing of type table showing the title field; the `title` attribute is the text of the table''s one header cell, and without it the table has no header'
      2-2-1: The subpages of a folder's index page are the pages in that folder and the subfolders with an index page of their own, as one level, in sidebar order; a subfolder without an index page is not listed, nor is anything further down
      2-2-2: On the site's home page the block lists the topics; on a page without subpages it renders nothing, and whatever the block contains is dropped
      2-2-3: A document format renders nothing for the block, as the subpages follow the page as its chapters
      3: All links in the output are relative, so the site works from file:// and below any URL prefix; links between pages of a topic are rewritten to the generated pages, raw HTML links are not
      3-1: A relative link to a page -- `.qmd` or `.md`, a page's `.html`, or a folder -- resolves against the folder of the page it is in, as the file system resolves it, and is rewritten to the generated page; a link that climbs out of the project root and back in through the root's own folder name, as links written for a larger tree do, lands on the page it names
      3-2: A link that leaves the project is left as written and warned about as leaving it; a link to a page that exists but is not part of the site -- a folder that is no topic, or a topic not selected -- is warned about as such, and only a target that does not exist is reported as not found
      4: The layout is responsive -- the contents list is hidden at 75em and narrower, the sidebar is off-canvas at 50em and narrower -- with all text sizes and the 42em text column in em
      5: The site has a dark mode following the system setting and print styles
      6: A search field in the navbar searches the titles and text of all pages of the site, in the browser, without a server
      6-1: The render writes the index -- each page's title, URL, topic, and visible text, after the conditional filter -- to `_site/search.js`, a script rather than JSON, so the search works from file:// too
      6-2: The search is Fuse.js, embedded in the binary and written to `_site/fuse.min.js`; it and the index are loaded only when the field gets the focus
      6-3: The search is fuzzy, ignores case and diacritics, and ranks a hit in a title above one in the text; a query shorter than two characters searches nothing
      6-4: The hits are listed below the field, at most ten, each with its page title, its topic, and a snippet of the text around the match with the matched words marked; a query without hits says so
      6-5: Up and Down select a hit, and open the closed list again; Enter opens the selected one or the first; Escape closes the list and keeps the query; "/" anywhere on the page puts the focus into the field
      6-6: Without JavaScript the field is not shown, and it is not printed
      6-7: The query is kept in the tab's session storage, so after opening a hit or closing the list the field still holds it and shows its hits again on focus, also on the other pages of the site; without session storage the search still works, it just forgets
      6-8: A clear button in the field, shown only while it holds a query, empties the field, closes the list, forgets the stored query, and puts the focus back into the field
      7: 'A format''s `css` lists project-relative stylesheets; each is copied verbatim (an .scss file is not compiled) to `_site/css/` and linked on every page after the site''s own stylesheet. A missing one fails the render before anything is written'
