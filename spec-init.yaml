feature:
  name: init
  description: Write a starter folio.yml into a Markdown tree that has none

components:
  COMMAND:
    description: folio init [--force] [--dry-run]
    requirements:
      1: Object name is "init"
      2: No subcommand
      3: Parameters
      3-1: Flag --project sets the path to the document tree. Defaults to the current directory
      3-2: Flag --dry-run prints the folio.yml that would be written instead of writing it. Defaults to false
      3-3: Flag --force overwrites an existing folio.yml. Defaults to false

constraints:
  STANDARD: See the constraints in spec.yaml.

  PROCESS:
    requirements:
      1: Write `folio.yml` in the project root, in the format described by CONFIG in spec.yaml
      1-1: An existing folio.yml or legacy qm.yml is an error unless --force is given; with --dry-run it is never an error and nothing is written
      1-2: The result is verified by loading it as a folio.yml before it is reported as written
      1-3: A tree without content folders is an error
      1-4: A tree with `_quarto*.yml` files is an error that points to `folio migrate`
      2: The title is the `title:` or first heading of the root index.qmd or index.md, else the first heading of README.md, else the folder name with `-` and `_` turned into spaces and each word capitalized
      3: Every content folder becomes a topic, in name order
      4: The only format is `web` (html)
      5: The `web` and `preview` sections state the default listen addresses
      6: Comments explain the file and show examples of a document format, audiences and `lang`
